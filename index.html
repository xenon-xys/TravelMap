<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>旅游地图 · 中国地级行政区</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; background: #EFB5B4; }
  body {
    margin: 0; padding: 0; height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    background: #EFB5B4; overflow: hidden;
  }
  /*
   * 宽屏自适应：网页版就是「整块画布」，不再套手机壳。
   * 电脑上地图铺满整个窗口，顶栏 / 底栏卡片浮在角落；
   * 手机上（窄屏）沿用原来的紧凑布局，顶栏和底栏分别贴住上下。
   */
  #phone {
    position: relative; width: 100%; height: 100%;
    background: #EFB5B4; display: flex; flex-direction: column;
  }
  #mapArea { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  svg { display: block; touch-action: none; cursor: grab; }
  svg.dragging { cursor: grabbing; }

  /* 电脑宽屏：地图占满整屏，底栏浮在左下角，不占版面高度 */
  @media (min-width: 760px) {
    #bottom {
      position: absolute; left: 16px; bottom: 16px; z-index: 10;
      width: 300px; padding: 0;
    }
    #bottomCard { padding: 8px 9px 7px; }
    /* 宽屏下地图主体顶到底，底栏只遮住左下角一小块 */
    #hintRow #hint { font-size: 10.5px; }
  }

  .card {
    background: rgba(255,255,255,.95); border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
  }
  #topbar {
    position: absolute; left: 10px; right: 10px; top: 10px;
    display: flex; align-items: center; gap: 6px; padding: 9px 8px 9px 14px;
  }
  #title { font-size: 20px; font-weight: 700; color: #141414; line-height: 1.1; }
  #stats { font-size: 11.5px; color: #6B4A4A; margin-top: 3px; white-space: nowrap; }
  /* 标题盒要能真正收缩，否则统计文字会把顶栏按钮挤出屏幕 */
  #titleBox { flex: 1 1 0; min-width: 0; overflow: hidden; }
  #title, #stats { overflow: hidden; text-overflow: ellipsis; }
  .sq {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px;
    background: rgba(20,20,20,.10); color: #141414; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    user-select: none; border: none; font-family: inherit;
  }
  .sq:active { background: rgba(20,20,20,.22); }
  .sq.wide { width: 48px; flex: 0 0 48px; font-size: 12px; }
  .sq.small { width: 48px; flex: 0 0 48px; height: 28px; font-size: 11.5px; border-radius: 8px; }
  #hintRow { display: flex; align-items: center; gap: 6px; }
  #hintRow #hint { flex: 1; }

  /* 安卓安装包下载入口（顶栏右侧，浮在地图上） */
  #apkBtn {
    position: absolute; right: 10px; top: 76px;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 12px;
    background: rgba(255,255,255,.95); color: #141414;
    font-size: 12.5px; font-weight: 700; text-decoration: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.14); cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  #apkBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #apkBtn:active { transform: translateY(0); }
  #apkIcon { font-size: 14px; line-height: 1; }
  #apkVer {
    font-size: 10.5px; font-weight: 500; color: #6B4A4A;
    background: rgba(20,20,20,.07); padding: 2px 5px; border-radius: 5px;
  }
  /*
   * 窄屏（手机）：顶栏放不下 5 个按钮，收起「−」「＋」
   * （手机本来就是双指缩放，不需要这两个键），只留 搜 / 清 / 分享。
   * APK 入口钉在右下角、底栏之上，完全不与顶栏抢位置。
   */
  @media (max-width: 759px) {
    #title { font-size: 17px; }
    #stats { font-size: 10.5px; }
    .sq { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; font-size: 12px; }
    .sq.wide { width: 40px; flex: 0 0 40px; font-size: 11px; }
    #topbar { padding: 6px 6px 6px 10px; gap: 4px; }
    #btnIn, #btnOut { display: none; }
    #apkBtn {
      top: auto; right: 10px; padding: 5px 9px; font-size: 11.5px;
    }
    #apkIcon { font-size: 12.5px; }
    #apkVer { font-size: 10px; }
  }

  #bottom { padding: 8px; flex: 0 0 auto; }
  #bottomCard { padding: 10px 10px 9px; }
  .row { display: flex; gap: 6px; }
  .row + .row { margin-top: 6px; }
  .chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 4px; border-radius: 9px; background: rgba(20,20,20,.06);
    cursor: pointer; user-select: none; border: 2px solid transparent;
    font-size: 11.5px; color: #141414; white-space: nowrap;
  }
  .chip.active { border-color: #141414; background: #fff; }
  .chip .dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(20,20,20,.35); flex: 0 0 14px; }
  .chip .cnt { color: #8A6A6A; font-size: 11px; }
  #hint { font-size: 11px; color: #6B4A4A; text-align: center; padding-top: 7px; }

  #detail { display: none; }
  #detail.show { display: block; }
  #detailHead { display: flex; align-items: center; gap: 6px; padding-bottom: 2px; }
  #dName { font-size: 16px; font-weight: 700; color: #141414; }
  #dProv { font-size: 11.5px; color: #6B4A4A; flex: 1; }
  #detail .chip { padding: 9px 4px; font-size: 13.5px; border-radius: 10px; }
  #detailSep { height: 1px; background: rgba(20,20,20,.13); margin: 9px 0 8px; }

  #toast {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    background: rgba(20,20,20,.82); color: #fff; font-size: 12.5px;
    padding: 8px 14px; border-radius: 18px; opacity: 0; transition: opacity .25s;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* 分享预览 */
  #shareMask {
    position: absolute; inset: 0; background: rgba(20,20,20,.55);
    display: none; align-items: center; justify-content: center; padding: 14px;
    z-index: 20;
  }
  #shareMask.show { display: flex; }
  #shareBox {
    background: #fff; border-radius: 14px; padding: 10px; max-width: 100%;
    max-height: 100%; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  #shareImg { max-width: 100%; max-height: 58vh; object-fit: contain; border-radius: 8px; }
  #shareTip { font-size: 11px; color: #6B4A4A; }
  #shareBtns { display: flex; gap: 6px; }

  /* 背景底图选择 */
  #bgMask {
    position: absolute; inset: 0; background: rgba(20,20,20,.55);
    display: none; align-items: center; justify-content: center; padding: 20px;
    z-index: 21;
  }
  #bgMask.show { display: flex; }
  #bgBox {
    background: #fff; border-radius: 14px; padding: 12px; width: 100%;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  #bgTitle { font-size: 15px; font-weight: 700; color: #141414; }
  #bgBox .sq { width: 100%; flex: 0 0 auto; height: 34px; font-size: 13px; }
  #shareBtns .sq { flex: 1; width: auto; height: 34px; font-size: 13px; }
  #shareBtns a.sq { text-decoration: none; }

  /* 成就系统：34 省级行政区 × 5 级到达 */
  #achMask, #dataMask, #searchMask, #confirmMask {
    position: absolute; inset: 0; background: rgba(20,20,20,.55);
    display: none; align-items: center; justify-content: center; padding: 14px;
    z-index: 22;
  }
  #achMask.show, #dataMask.show, #searchMask.show, #confirmMask.show { display: flex; }
  #achBox {
    background: #fff; border-radius: 14px; padding: 12px; width: 100%;
    max-width: 460px; max-height: 86vh; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  #achHead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #achTitle { font-size: 15px; font-weight: 700; color: #141414; }
  #achSummary { font-size: 11px; color: #6B4A4A; flex: 1; min-width: 120px; }
  #achHead .sq { width: auto; padding: 0 10px; height: 30px; font-size: 12px; flex: 0 0 auto; }
  #achList {
    flex: 1 1 auto; overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 6px;
    scrollbar-width: thin; scrollbar-color: rgba(20,20,20,.3) transparent;
  }
  #achList::-webkit-scrollbar { width: 8px; }
  #achList::-webkit-scrollbar-thumb { background: rgba(20,20,20,.25); border-radius: 4px; }
  #achList::-webkit-scrollbar-track { background: transparent; }
  .prov { flex: 0 0 auto; border: 1px solid rgba(20,20,20,.10); border-radius: 10px; overflow: hidden; }
  .provHead {
    display: flex; align-items: center; gap: 6px; padding: 7px 9px; cursor: pointer;
    user-select: none; background: rgba(20,20,20,.03);
  }
  .provHead:active { background: rgba(20,20,20,.08); }
  .caret { font-size: 11px; color: #8A6A6A; width: 12px; flex: 0 0 12px; }
  .provName { font-size: 13.5px; font-weight: 600; color: #141414; }
  .provStat { margin-left: auto; font-size: 11px; color: #6B4A4A; }
  .provLevels { display: none; padding: 4px 6px 6px; }
  .prov.open .provLevels { display: block; }
  .lvl { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; }
  .lvl .dot { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(20,20,20,.25); flex: 0 0 10px; }
  .lvlName { color: #141414; }
  .lvlCount { margin-left: auto; color: #6B4A4A; font-variant-numeric: tabular-nums; }

  /* 数据备份（导出/导入 JSON） */
  #dataBox {
    background: #fff; border-radius: 14px; padding: 12px; width: 100%;
    max-width: 340px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  #dataTitle { font-size: 15px; font-weight: 700; color: #141414; }
  #dataTip { font-size: 11px; color: #6B4A4A; line-height: 1.5; }
  #dataBox .sq { width: 100%; flex: 0 0 auto; height: 34px; font-size: 13px; }

  /* 搜索 / 确认清空弹层 */
  #searchBox, #confirmBox {
    background: #fff; border-radius: 14px; padding: 12px; width: 100%;
    max-width: 340px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  #searchTitle { font-size: 15px; font-weight: 700; color: #141414; }
  #confirmMsg { font-size: 13px; color: #141414; line-height: 1.5; }
  #searchInput {
    font-size: 14px; padding: 9px 10px; border: 1px solid rgba(20,20,20,.2);
    border-radius: 9px; outline: none; font-family: inherit; color: #141414;
  }
  #searchInput:focus { border-color: #141414; }
  #searchBtns, #confirmBtns { display: flex; gap: 6px; }
  #searchBtns .sq, #confirmBtns .sq { flex: 1; width: auto; height: 34px; font-size: 13px; }
</style>
</head>
<body>
<div id="phone">
  <div id="mapArea">
    <svg id="svg" preserveAspectRatio="none" width="100" height="100">
      <rect id="bg" x="0" y="0" width="100" height="100" fill="#EFB5B4"/>
      <!--
        背景底图：整张按「完整可见」居中，四周空出来的部分用图片自己的边缘像素
        向外延展填满（四条边各是一段嵌套 svg，用 viewBox 切出源图最外一行/列再拉伸）。
        布局在 layoutBgCover() 里算。
      -->
      <g id="bgWrap">
        <svg id="bgEdgeTop"    preserveAspectRatio="none"><image preserveAspectRatio="none"/></svg>
        <svg id="bgEdgeBottom" preserveAspectRatio="none"><image preserveAspectRatio="none"/></svg>
        <svg id="bgEdgeLeft"   preserveAspectRatio="none"><image preserveAspectRatio="none"/></svg>
        <svg id="bgEdgeRight"  preserveAspectRatio="none"><image preserveAspectRatio="none"/></svg>
        <image id="bgCover" preserveAspectRatio="none"/>
      </g>
      <g id="gMain">
        <g id="fills"></g>
        <g id="strokes"></g>
        <g id="jds"></g>
        <g id="labels"></g>
        <g id="marks"></g>
      </g>
      <g id="gInset"></g>
    </svg>
    <div id="topbar" class="card">
      <div id="titleBox">
        <div id="title">旅游地图</div>
        <div id="stats"></div>
      </div>
      <button class="sq" id="btnSearch" title="搜索地区">搜</button>
      <button class="sq" id="btnOut" title="缩小">−</button>
      <button class="sq" id="btnIn" title="放大">＋</button>
      <button class="sq" id="btnReset" title="清空全部记录">清</button>
      <button class="sq wide" id="btnShare" title="分享地图图片">分享</button>
    </div>
    <!-- 安卓安装包：网页版与 APK 双版本同步发布，文件名与版本号由 build_web.py 注入 -->
    <a id="apkBtn" class="card" href="travel-map-v1.6.apk" download="旅游地图-v1.6.apk">
      <span id="apkIcon">↓</span>
      <span id="apkText">下载安卓版</span>
      <span id="apkVer">v1.6</span>
    </a>
    <div id="toast"></div>
    <div id="bgMask">
      <div id="bgBox">
        <div id="bgTitle">背景底图</div>
        <input type="file" id="bgFile" accept="image/*" hidden>
        <button class="sq" id="btnBgPick">从本地选择图片</button>
        <button class="sq" id="btnBgReset">恢复内置封面</button>
        <button class="sq" id="btnBgClose">取消</button>
      </div>
    </div>
    <div id="shareMask">
      <div id="shareBox">
        <img id="shareImg" alt="分享预览">
        <div id="shareTip"></div>
        <div id="shareBtns">
          <a class="sq" id="btnDownload" download="travel-map.png">下载图片</a>
          <button class="sq" id="btnShareClose">关闭</button>
        </div>
      </div>
    </div>
    <!-- 成就系统：34 个省级行政区 × 5 级到达情况 -->
    <div id="achMask">
      <div id="achBox">
        <div id="achHead">
          <span id="achTitle">成就 · 省级行政区到达</span>
          <span id="achSummary"></span>
          <button class="sq" id="btnAchExpand">全部展开</button>
          <button class="sq" id="btnAchClose" style="width:30px;height:30px;flex:0 0 30px;font-size:15px">×</button>
        </div>
        <div id="achList"></div>
      </div>
    </div>
    <!-- 数据备份：导出 / 导入 JSON -->
    <div id="dataMask">
      <div id="dataBox">
        <div id="dataTitle">数据备份</div>
        <div id="dataTip">网页端数据只存在本浏览器，换设备或清缓存后会丢失。可导出 JSON 备份，或导入手机 / 其他设备的数据。</div>
        <input type="file" id="dataFile" accept="application/json,.json" hidden>
        <button class="sq" id="btnExport">导出数据（JSON）</button>
        <button class="sq" id="btnImport">导入数据（JSON）</button>
        <button class="sq" id="btnDataClose">关闭</button>
      </div>
    </div>
    <!-- 搜索地区（自定义弹层，替代会被沙箱 iframe 屏蔽的 prompt()） -->
    <div id="searchMask">
      <div id="searchBox">
        <div id="searchTitle">搜索地区</div>
        <input id="searchInput" type="text" placeholder="输入地区名，如 苏州 / 丽江 / 新疆" autocomplete="off">
        <div id="searchBtns">
          <button class="sq" id="btnSearchGo">搜索</button>
          <button class="sq" id="btnSearchClose">取消</button>
        </div>
      </div>
    </div>
    <!-- 确认清空（替代 confirm()） -->
    <div id="confirmMask">
      <div id="confirmBox">
        <div id="confirmMsg">所有地区都会回到「未去过」，此操作不可撤销。</div>
        <div id="confirmBtns">
          <button class="sq" id="btnConfirmOk">清空</button>
          <button class="sq" id="btnConfirmCancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="bottomCard" class="card">
      <div id="detail">
        <div id="detailHead">
          <span id="dName"></span><span id="dProv"></span>
          <button class="sq" id="btnClose" style="width:30px;height:30px;flex:0 0 30px;font-size:15px">×</button>
        </div>
        <div class="row" id="detailRow1"></div>
        <div class="row" id="detailRow2"></div>
        <div id="detailSep"></div>
      </div>
      <div class="row" id="legendRow1"></div>
      <div class="row" id="legendRow2"></div>
      <div id="hintRow">
        <div id="hint"></div>
        <button class="sq small" id="btnAch" title="成就系统">成就</button>
        <button class="sq small" id="btnData" title="导出/导入数据">数据</button>
        <button class="sq small" id="btnBg2" title="更换背景底图">背景</button>
      </div>
    </div>
  </div>
</div>

/* ---------- polyline 解码 ---------- */
function decode(s) {
  const out = []; let i = 0, x = 0, y = 0;
  while (i < s.length) {
    let r = 0, sh = 0, b;
    do { b = s.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    x += (r & 1) ? ~(r >> 1) : (r >> 1);
    r = 0; sh = 0;
    do { b = s.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    y += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push(x / 10, y / 10);
  }
  return out;
}
function decodeAll(a) { return (a || []).map(decode); }

const JD_MAIN = decodeAll(DATA.jd);
const JD_INSET = decodeAll(DATA.jdInset);

UNITS.forEach(u => {
  u.rings = decodeAll(u.p);
  u.dots = u.d || [];
  u.dStr = u.rings.map(r => {
    let s = '';
    for (let k = 0; k < r.length; k += 2) s += (k ? 'L' : 'M') + r[k] + ' ' + r[k + 1];
    return s + 'Z';
  }).join('');
});

/* ---------- 状态 ---------- */
let states = new Int8Array(N).fill(UNVISITED);
try {
  const raw = localStorage.getItem('travelmap_states');
  if (raw) {
    const idx = {}; UNITS.forEach((u,i)=>idx[u.code]=i);
    raw.split(',').forEach(p => {
      const k = p.indexOf(':'); if (k <= 0) return;
      const i = idx[p.slice(0,k)]; if (i === undefined) return;
      const v = parseInt(p.slice(k+1),10); if (v >= 0 && v <= 5) states[i] = v;
    });
  }
} catch(e) {}
function persist() {
  const out = [];
  for (let i = 0; i < N; i++) if (states[i] !== UNVISITED) out.push(UNITS[i].code + ':' + states[i]);
  try { localStorage.setItem('travelmap_states', out.join(',')); } catch(e) {}
}

/* ---------- 视图变换 ---------- */
const svg = document.getElementById('svg');
const gMain = document.getElementById('gMain');
const gFills = document.getElementById('fills');
const gStrokes = document.getElementById('strokes');
const gJds = document.getElementById('jds');
const gLabels = document.getElementById('labels');
const gMarks = document.getElementById('marks');
const gInset = document.getElementById('gInset');
const mapArea = document.getElementById('mapArea');

let W = 1, H = 1, fit = 1, zoom = 1, tx = 0, ty = 0;
let INSET_TOP = 96, INSET_BOTTOM = 4, DPR = 1, extraBottom = 0, WIDE = false;
let selected = -1, brush = null, detailIndex = -1;

const SVGNS = 'http://www.w3.org/2000/svg';
const fillEls = [], strokeEls = [], labelEls = [], dotFills = [], dotStrokes = [];

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function px(v) { return v / DPR; }   /* CSS px */

/* ---------- 建图 ---------- */
let insetW = 100;   /* 南海小图在屏幕上的宽度 */

function build() {
  const fb = document.createDocumentFragment(), fs = document.createDocumentFragment();

  UNITS.forEach((u, i) => {
    if (u.f !== 0) return;
    const p = el('path', {
      d: u.dStr, fill: COLORS[states[i]], 'fill-rule': 'evenodd',
      stroke: INK, 'stroke-width': 0.55, 'vector-effect': 'non-scaling-stroke',
      'stroke-linejoin': 'round'
    });
    p.__i = i; fb.appendChild(p); fillEls[i] = p;
    const s = el('path', { d: '', fill: 'none' });
    fs.appendChild(s); strokeEls[i] = s;
  });
  gFills.appendChild(fb);

  /* 圆点（极小的岛礁等） */
  UNITS.forEach((u, i) => {
    if (u.f !== 0) return;
    const c = el('circle', { cx: u.cx, cy: u.cy, r: 1.5, display: 'none' });
    gFills.appendChild(c); dotFills[i] = c;
  });

  /* 九段线 */
  JD_MAIN.forEach(seg => {
    let d = '';
    for (let k = 0; k < seg.length; k += 2) d += (k ? 'L' : 'M') + seg[k] + ' ' + seg[k + 1];
    gJds.appendChild(el('path', {
      d, fill: 'none', stroke: JD_COLOR, 'stroke-width': 1.1,
      'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke'
    }));
  });

  /* 地名 */
  UNITS.forEach((u, i) => {
    if (u.f !== 0) return;
    const t = el('text', {
      'text-anchor': 'middle', fill: '#1A1A1A', 'font-weight': 400,
      'font-family': '"PingFang SC","Microsoft YaHei",sans-serif'
    });
    t.__i = i; gLabels.appendChild(t); labelEls[i] = t;
  });

  /* 选中高亮（跟着主图变换） */
  window._sel = el('path', { fill: 'none', stroke: '#141414', 'stroke-width': 2,
                             display: 'none', 'vector-effect': 'non-scaling-stroke' });
  window._selIn = el('path', { fill: 'none', stroke: '#FFFFFF', 'stroke-width': 4,
                               display: 'none', 'vector-effect': 'non-scaling-stroke' });
  gMarks.appendChild(window._selIn); gMarks.appendChild(window._sel);

  buildInset();
}

/* ---------- 南海诸岛小图：固定在屏幕右下角，不随主图缩放 ---------- */
let insetScale = 1, insetX = 0, insetY = 0, insetH = 0;
const insetUnitEls = [], insetDotEls = [];

function buildInset() {
  gInset.appendChild(el('rect', { id: 'insetBg', x: 0, y: 0, width: 10, height: 10,
                                  rx: 7, fill: 'rgba(255,255,255,.94)',
                                  stroke: 'rgba(20,20,20,.22)', 'stroke-width': 1 }));
  const g = el('g', { id: 'insetScaled' });
  gInset.appendChild(g);
  const cap = el('text', { id: 'insetCap', 'text-anchor': 'middle', fill: '#7A5C5C',
                           'font-size': 8.5,
                           'font-family': '"PingFang SC","Microsoft YaHei",sans-serif' });
  cap.textContent = '南海诸岛';
  gInset.appendChild(cap);
  window._insetG = g;

  UNITS.forEach((u, i) => {
    if (u.f !== 1) return;
    const p = el('path', {
      d: u.dStr, fill: COLORS[states[i]], 'fill-rule': 'evenodd', stroke: INK,
      'stroke-width': 0.8, 'vector-effect': 'non-scaling-stroke'
    });
    p.__i = i; g.appendChild(p); insetUnitEls[i] = p;
    u.dots.forEach(pt => {
      const c = el('circle', { cx: pt[0], cy: pt[1], r: 1.6, fill: COLORS[states[i]],
                               stroke: INK, 'stroke-width': 0.6,
                               'vector-effect': 'non-scaling-stroke' });
      c.__i = i; g.appendChild(c); insetDotEls.push(c);
    });
  });
  JD_INSET.forEach(seg => {
    let d = '';
    for (let k = 0; k < seg.length; k += 2) d += (k ? 'L' : 'M') + seg[k] + ' ' + seg[k + 1];
    g.appendChild(el('path', { d, fill: 'none', stroke: JD_COLOR, 'stroke-width': 1,
                               'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }));
  });
}

function layoutInset() {
  insetW = Math.max(px(74), Math.min(W * 0.29, px(124)));
  insetH = insetW * INH / INW;
  const m = px(10);
  insetX = W - insetW - m;
  insetY = H - INSET_BOTTOM - extraBottom - insetH - m;
  insetScale = insetW / INW;
  /* 岛礁圆点保持屏幕上的固定大小 */
  insetDotEls.forEach(c => c.setAttribute('r', 1.7 / insetScale));

  const bg = document.getElementById('insetBg');
  bg.setAttribute('x', insetX); bg.setAttribute('y', insetY);
  bg.setAttribute('width', insetW); bg.setAttribute('height', insetH);
  window._insetG.setAttribute('transform',
    `translate(${insetX},${insetY}) scale(${insetScale})`);
  const cap = document.getElementById('insetCap');
  cap.setAttribute('x', insetX + insetW / 2);
  cap.setAttribute('y', insetY + insetH - px(4));
}

/* ---------- 标签 ---------- */
function splitBalanced(s) {
  const n = s.length, first = Math.ceil(n / 2);
  return [s.slice(0, first), s.slice(first)];
}

let labelKey = '';

/*
 * 地名规则（与安卓端 drawLabels 一致，v1.1 沿用至今，请勿改动）：
 *   区域在屏幕上的短边 >= 11dp 才画字；>= 24dp 才写完整简称并折两行；
 *   字号按区域尺寸自适应，并夹在 7–11.5dp 之间。
 *
 * 唯一和安卓不同的地方：安卓用 canvas 屏幕坐标直接 drawText，
 * 而这里的 #labels 在 #gMain 里，font-size 是「地图单位」会跟着 scale(s) 一起缩放，
 * 所以要把算好的屏幕像素除以 s 再写进去，两边看起来才一样。
 */
function renderLabels(s) {
  const visible = [];
  UNITS.forEach((u, i) => {
    if (u.f !== 0) return;
    const wPx = (u.b[2] - u.b[0]) * s, hPx = (u.b[3] - u.b[1]) * s;
    const m = Math.min(wPx, hPx);
    if (m < px(LABEL_MIN_DP)) { labelEls[i].setAttribute('display', 'none'); return; }
    labelEls[i].removeAttribute('display');
    visible.push([i, u, wPx, hPx, m]);
  });
  /* 只有字号/内容需要改的时候才动 DOM */
  const key = visible.map(v => v[0] + ':' + v[4].toFixed(1)).join(',');
  if (key === labelKey) return;
  labelKey = key;
  visible.forEach(([i, u, wPx, hPx, m]) => {
    const t = labelEls[i];
    const detailed = m >= px(LABEL_DETAIL_DP);
    const text = detailed ? u.short : u.short.slice(0, 2);
    const lines = text.length <= 2 ? [text] : splitBalanced(text);
    const maxLen = Math.max(...lines.map(l => l.length));
    const screenPx = Math.max(px(7), Math.min(px(11.5),
      Math.min(wPx * 0.92 / maxLen, hPx * 0.86 / lines.length)));
    const size = screenPx / s;
    if (t.__size !== size || t.__text !== text) {
      t.__size = size; t.__text = text;
      t.setAttribute('font-size', size);
      t.textContent = '';
      const lh = size * 1.12, total = lh * lines.length;
      lines.forEach((ln, k) => {
        const ts = el('tspan', { x: u.cx, y: u.cy + total / 2 - (lines.length - 1 - k) * lh - size * 0.32 });
        ts.textContent = ln; t.appendChild(ts);
      });
    } else {
      const tsv = t.childNodes;
      for (let k = 0; k < tsv.length; k++) tsv[k].setAttribute('x', u.cx);
      t.setAttribute('y', 0);
    }
  });
}

/* 太小的地区改用圆点表示（画多边形只有零点几个像素，等于没画） */
function syncDots(s) {
  const sPx = s / DPR;
  UNITS.forEach((u, i) => {
    if (u.f !== 0) return;
    const small = Math.min((u.b[2] - u.b[0]), (u.b[3] - u.b[1])) * sPx < 3;
    const c = dotFills[i];
    if (small || u.rings.length === 0) {
      c.removeAttribute('display');
      c.setAttribute('cx', u.cx); c.setAttribute('cy', u.cy);
      c.setAttribute('r', 1.6 / s);
      fillEls[i].setAttribute('display', 'none');
    } else {
      c.setAttribute('display', 'none');
      fillEls[i].removeAttribute('display');
    }
  });
}

function applyTransform() {
  const s = fit * zoom;
  gMain.setAttribute('transform', `translate(${tx},${ty}) scale(${s})`);
  syncDots(s);
  renderLabels(s);
  layoutInset();
  showSelection();
}

function clamp() {
  const s = fit * zoom, cw = MAPW * s, ch = MAPH * s;
  const availH = H - INSET_TOP - INSET_BOTTOM;
  /* 地图始终在整窗内居中（宽屏也一样），不再因左下浮层底栏而向右偏移 */
  tx = cw <= W ? (W - cw) / 2 : Math.min(0, Math.max(W - cw, tx));
  ty = ch <= availH ? INSET_TOP + (availH - ch) / 2
                    : Math.min(INSET_TOP, Math.max(H - INSET_BOTTOM - ch, ty));
}

function resetView() {
  const availH = H - INSET_TOP - INSET_BOTTOM;
  fit = Math.min(W / MAPW, availH / MAPH) * 0.97;
  zoom = 1;
  tx = (W - MAPW * fit) / 2;
  ty = INSET_TOP + (availH - MAPH * fit) / 2;
  /* 右下角小图别压住陆地 */
  const need = px(74) * INH / INW + px(18);
  const slack = (INSET_TOP + availH) - (ty + MAPH * fit);
  if (slack < need) ty = Math.max(INSET_TOP, ty - (need - slack));
  labelKey = '';
  applyTransform();
}

function zoomAround(cx, cy, factor) {
  const old = zoom;
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
  if (zoom === old) return;
  const k = zoom / old;
  tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
  clamp(); applyTransform();
}

function focusUnit(i, target) {
  const u = UNITS[i];
  selected = i;
  if (u.f !== 0) { applyTransform(); return; }
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, target || 3.4));
  const s = fit * zoom;
  tx = W / 2 - u.cx * s;
  ty = INSET_TOP + (H - INSET_TOP - INSET_BOTTOM) / 2 - u.cy * s;
  clamp(); applyTransform();
}

function showSelection() {
  if (selected < 0 || UNITS[selected].f !== 0) {
    window._sel.setAttribute('display', 'none');
    window._selIn.setAttribute('display', 'none');
    return;
  }
  const d = UNITS[selected].dStr;
  window._sel.setAttribute('d', d); window._sel.removeAttribute('display');
  window._selIn.setAttribute('d', d); window._selIn.removeAttribute('display');
}

/* ---------- 尺寸 ---------- */
let lastW = 0, lastH = 0, inited = false;

function setCanvasSize(w, h) {
  W = w; H = h;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const bg = document.getElementById('bg');
  bg.setAttribute('width', W);
  bg.setAttribute('height', H);
  layoutBgCover();
}

/*
 * 背景底图：整张按「完整可见」居中，四周空出来的部分用**图片自己的边缘像素**
 * 向外延展填满（和安卓端的 BitmapShader CLAMP 平铺是一个效果）。
 * 四条边各是一段嵌套 <svg>：viewBox 切出源图最外一行 / 一列，再拉伸到整条留白。
 */
let bgNatural = null;
let bgSource = null;                 /* 当前生效的图源，null 表示内置封面 */

function setBgSource(src) {
  document.querySelectorAll('#bgWrap image').forEach(el => {
    el.setAttribute('href', src);
    el.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', src);
  });
}

function placeStrip(id, x, y, w, h, viewBox, bw, bh) {
  const svg = document.getElementById(id);
  svg.setAttribute('x', x); svg.setAttribute('y', y);
  svg.setAttribute('width', Math.max(0, w)); svg.setAttribute('height', Math.max(0, h));
  svg.setAttribute('viewBox', viewBox);
  const im = svg.querySelector('image');
  im.setAttribute('x', 0); im.setAttribute('y', 0);
  im.setAttribute('width', bw); im.setAttribute('height', bh);
}

function layoutBgCover() {
  const wrap = document.getElementById('bgWrap');
  if (!bgSource) { wrap.setAttribute('display', 'none'); return; }
  wrap.removeAttribute('display');

  if (!bgNatural) {
    setBgSource(bgSource);
    const probe = new Image();
    probe.onload = () => {
      bgNatural = { w: probe.naturalWidth, h: probe.naturalHeight };
      sampleBgEdge(probe);
      layoutBgCover();
    };
    probe.src = bgSource;
    return;
  }

  const bw = bgNatural.w, bh = bgNatural.h;
  const sc = Math.min(W / bw, H / bh);
  const iw = bw * sc, ih = bh * sc;
  const ix = (W - iw) / 2, iy = (H - ih) / 2;

  const img = document.getElementById('bgCover');
  img.setAttribute('x', ix); img.setAttribute('y', iy);
  img.setAttribute('width', iw); img.setAttribute('height', ih);

  /* 上下两条留白用源图最上一行 / 最下一行；左右两条用最左一列 / 最右一列 */
  placeStrip('bgEdgeTop',    ix, 0, iw, iy, `0 0 ${bw} 1`, bw, bh);
  placeStrip('bgEdgeBottom', ix, iy + ih, iw, H - (iy + ih), `0 ${Math.max(0, bh - 1)} ${bw} 1`, bw, bh);
  placeStrip('bgEdgeLeft',   0, iy, ix, ih, `0 0 1 ${bh}`, bw, bh);
  placeStrip('bgEdgeRight',  ix + iw, iy, W - (ix + iw), ih, `${Math.max(0, bw - 1)} 0 1 ${bh}`, bw, bh);
}

/* 取图片四条边的平均色当兜底色 —— 这样即使延展条出问题也不会露出粉色 */
function sampleBgEdge(img) {
  try {
    const n = 24;
    const cv = document.createElement('canvas');
    cv.width = n; cv.height = n;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, n, n);
    const d = ctx.getImageData(0, 0, n, n).data;
    let r = 0, g = 0, b = 0, c = 0;
    const add = (x, y) => { const i = (y * n + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; c++; };
    for (let k = 0; k < n; k++) { add(k, 0); add(k, n - 1); add(0, k); add(n - 1, k); }
    const col = `rgb(${Math.round(r / c)},${Math.round(g / c)},${Math.round(b / c)})`;
    document.getElementById('bg').setAttribute('fill', col);
    /* 底栏卡片周围露出来的也是这块底色，一并换成边缘色，整屏不留粉 */
    document.getElementById('phone').style.background = col;
  } catch (e) { /* 取样失败就保留原底色 */ }
}

/* 换背景：传 null 恢复内置封面 */
function applyBackground(src) {
  bgSource = src || BG_COVER;
  bgNatural = null;
  layoutBgCover();
}

function onSize() {
  const r = mapArea.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if (w < 20 || h < 20) return;
  DPR = window.devicePixelRatio || 1;
  INSET_TOP = Math.round(document.getElementById('topbar').getBoundingClientRect().height) + 16;
  /*
   * 底栏在宽屏是浮在左下角的卡片、窄屏是贴底的文档流，两种情况下
   * 都只需要让出一点点底部内边距 —— 地图主体要尽量铺满，别浪费屏幕。
   */
  WIDE = window.matchMedia('(min-width: 760px)').matches;
  INSET_BOTTOM = px(4);
  /*
   * APK 入口定位：
   *   宽屏 —— 顶栏正下方靠右（那里是空的）；
   *   窄屏 —— 右下角、底栏之上（顶栏下方那一条会被顶栏和地图挤，放不下）。
   */
  const apkEl = document.getElementById('apkBtn');
  if (WIDE) {
    apkEl.style.bottom = '';
    apkEl.style.top = Math.round(
      document.getElementById('topbar').getBoundingClientRect().bottom + 8) + 'px';
  } else {
    apkEl.style.top = '';
    apkEl.style.bottom = px(10) + 'px';
  }
  if (!inited) {
    inited = true; lastW = w; lastH = h;
    setCanvasSize(w, h);
    resetView();
    refreshHint();
    return;
  }
  if (Math.abs(w - lastW) < 1 && Math.abs(h - lastH) < 1) return;
  const s0 = fit * zoom;
  const cxMap = (lastW / 2 - tx) / s0;
  const cyMap = (lastH / 2 - ty) / s0;
  lastW = w; lastH = h;
  setCanvasSize(w, h);
  fit = Math.min(W / MAPW, (H - INSET_TOP - INSET_BOTTOM) / MAPH) * 0.97;
  const s1 = fit * zoom;
  tx = W / 2 - cxMap * s1;
  ty = H / 2 - cyMap * s1;
  labelKey = '';
  clamp(); applyTransform();
  refreshHint();
}

window.addEventListener('load', onSize);
window.addEventListener('resize', onSize);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(onSize).observe(mapArea);
requestAnimationFrame(onSize);

/* ---------- 命中测试 ---------- */
function inRing(x, y, r) {
  let inside = false;
  const n = r.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = r[i*2], yi = r[i*2+1], xj = r[j*2], yj = r[j*2+1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function unitContains(u, x, y, dotR) {
  if (x < u.b[0] - dotR || x > u.b[2] + dotR || y < u.b[1] - dotR || y > u.b[3] + dotR) return false;
  for (const r of u.rings) if (inRing(x, y, r)) return true;
  for (const p of u.dots) {
    const dx = x - p[0], dy = y - p[1];
    if (dx * dx + dy * dy <= dotR * dotR) return true;
  }
  return false;
}
function hitTest(cx, cy) {
  if (cx >= insetX && cx <= insetX + insetW && cy >= insetY && cy <= insetY + insetH) {
    const mx = (cx - insetX) / insetScale, my = (cy - insetY) / insetScale;
    for (let i = N - 1; i >= 0; i--) if (UNITS[i].f === 1 && unitContains(UNITS[i], mx, my, px(10) / insetScale)) return i;
    const only = UNITS.findIndex(u => u.f === 1);
    return only;
  }
  const s = fit * zoom;
  const mx = (cx - tx) / s, my = (cy - ty) / s;
  const dotR = px(7) / s;
  for (let i = N - 1; i >= 0; i--) if (UNITS[i].f === 0 && unitContains(UNITS[i], mx, my, dotR)) return i;
  return -1;
}

/* ---------- 交互 ---------- */
let dragging = false, moved = 0, lastX = 0, lastY = 0, downInInset = false;
const pointers = new Map();
let pinchDist = 0;

svg.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; svg.classList.add('dragging');
    const rr = mapArea.getBoundingClientRect();
    downInInset = (e.clientX - rr.left >= insetX && e.clientY - rr.top >= insetY);
  }
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) {
      const r = mapArea.getBoundingClientRect();
      zoomAround((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinchDist);
    }
    pinchDist = d; moved = 99;
    return;
  }
  if (!dragging) return;
  if (downInInset) return;   /* 从小图上起手就不拖主图 */
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  tx += dx; ty += dy; clamp(); applyTransform();
});

function endPointer(e) {
  const wasTap = pointers.size === 1 && moved < 6;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { dragging = false; svg.classList.remove('dragging'); pinchDist = 0; }
  if (!wasTap) return;
  const r = mapArea.getBoundingClientRect();
  const hit = hitTest(e.clientX - r.left, e.clientY - r.top);
  if (hit >= 0) onTap(hit);
  else { selected = -1; showSelection(); }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); dragging = false; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = mapArea.getBoundingClientRect();
  zoomAround(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.18 : 1 / 1.18);
}, { passive: false });

function onTap(i) {
  selected = i; showSelection();
  if (brush !== null) { setState(i, brush); }
  else showDetail(i);
}

/* ---------- 面板 ---------- */
const detail = document.getElementById('detail');
const dName = document.getElementById('dName');
const dProv = document.getElementById('dProv');
const hint = document.getElementById('hint');
const statsEl = document.getElementById('stats');
const detailRow1 = document.getElementById('detailRow1');
const detailRow2 = document.getElementById('detailRow2');
const legendRow1 = document.getElementById('legendRow1');
const legendRow2 = document.getElementById('legendRow2');
const legendCountEls = [], legendChipEls = [], detailChipEls = [];

function makeChip(state, big, onClick) {
  const c = document.createElement('div');
  c.className = 'chip';
  const d = document.createElement('span');
  d.className = 'dot'; d.style.background = COLORS[state];
  c.appendChild(d);
  const l = document.createElement('span');
  l.textContent = NAMES[state];
  c.appendChild(l);
  if (!big) {
    const n = document.createElement('span');
    n.className = 'cnt'; n.textContent = '0';
    legendCountEls[state] = n; c.appendChild(n);
  }
  c.addEventListener('click', onClick);
  return c;
}

function buildChips() {
  for (let s = 0; s < 6; s++) {
    const le = makeChip(s, false, () => toggleBrush(s));
    legendChipEls[s] = le;
    (s < 3 ? legendRow1 : legendRow2).appendChild(le);
    const de = makeChip(s, true, () => { if (detailIndex >= 0) { setState(detailIndex, s); closeDetail(); } });
    detailChipEls[s] = de;
    (s < 3 ? detailRow1 : detailRow2).appendChild(de);
  }
}

function toggleBrush(s) {
  brush = (brush === s) ? null : s;
  closeDetail(); refreshLegend(); refreshHint();
}

function refreshLegend() {
  for (let s = 0; s < 6; s++) {
    legendChipEls[s].classList.toggle('active', brush === s);
    detailChipEls[s].classList.toggle('active', detailIndex >= 0 && states[detailIndex] === s);
  }
}

function showDetail(i) {
  detailIndex = i;
  dName.textContent = UNITS[i].name;
  dProv.textContent = UNITS[i].prov === UNITS[i].name ? '' : UNITS[i].prov;
  detail.classList.add('show');
  refreshLegend(); refreshHint();
}
function closeDetail() {
  detailIndex = -1; detail.classList.remove('show');
  selected = -1; showSelection();
  refreshLegend(); refreshHint();
}

function paint(i) {
  const c = COLORS[states[i]];
  if (fillEls[i]) fillEls[i].setAttribute('fill', c);
  if (dotFills[i]) dotFills[i].setAttribute('fill', c);
  if (insetUnitEls[i]) insetUnitEls[i].setAttribute('fill', c);
  insetDotEls.forEach(e => { if (e.__i === i) e.setAttribute('fill', c); });
}

function setState(i, s) {
  states[i] = s;
  paint(i);
  persist(); refreshStats();
  if (detailIndex === i) refreshLegend();
}

function refreshStats() {
  const cnt = [0,0,0,0,0,0];
  let visited = 0, score = 0;
  for (let i = 0; i < N; i++) { const s = states[i]; cnt[s]++; if (s !== UNVISITED) visited++; score += WEIGHTS[s]; }
  for (let s = 0; s < 6; s++) if (legendCountEls[s]) legendCountEls[s].textContent = cnt[s];
  const pct = (visited * 100 / N).toFixed(1);
  statsEl.textContent = `已点亮 ${visited} / ${N} 个地级行政区 · 覆盖率 ${pct}% · 分数 ${score}`;
  if (location.search.indexOf('debug') >= 0) {
    statsEl.textContent += `  [W=${W.toFixed(0)} H=${H.toFixed(0)} fit=${fit.toFixed(2)}]`;
  }
}

function refreshHint() {
  if (brush !== null) hint.textContent = `画笔：${NAMES[brush]} · 点地图连续标记，再点图例退出`;
  else if (detailIndex >= 0) hint.textContent = '点颜色设定该地区的旅途状态';
  else hint.textContent = '点地图查看并标记 · 点下方图例选画笔可连续标记 · 双指缩放看地名';
  if (location.search.indexOf('debug') >= 0) {
    const r = mapArea.getBoundingClientRect();
    document.title = `DBG map=${r.width.toFixed(0)}x${r.height.toFixed(0)} W=${W} H=${H}`
      + ` fit=${fit.toFixed(3)} tx=${tx.toFixed(0)} ty=${ty.toFixed(0)}`
      + ` inset=${insetX.toFixed(0)},${insetY.toFixed(0)},${insetW.toFixed(0)},${insetH.toFixed(0)}`;
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ---------- 分享导图：保留界线、去掉地名、带仅供参考声明 ---------- */
const SHARE_STRIP = 30;          /* 底部声明条高度（CSS px） */
const SHARE_SCALE = 2;           /* 导出 2 倍图 */
const DISCLAIMER = '本图仅供参考，行政区划界线以国家正式发布的标准地图为准';

function buildShareCanvas() {
  /* 先临时切到「整幅地图」视角，克隆完 DOM 再还原 */
  const old = { zoom: zoom, tx: tx, ty: ty, fit: fit, extra: extraBottom };
  zoom = 1;
  const availH = H - INSET_TOP - INSET_BOTTOM - SHARE_STRIP;
  fit = Math.min(W / MAPW, availH / MAPH) * 0.97;
  tx = (W - MAPW * fit) / 2;
  ty = INSET_TOP + (availH - MAPH * fit) / 2;
  extraBottom = SHARE_STRIP;

  const s = fit * zoom;
  gMain.setAttribute('transform', `translate(${tx},${ty}) scale(${s})`);
  syncDots(s);
  layoutInset();
  /* 分享图：南海小图从「窗口右下角」改到「地图右下角」，避免宽屏下地图左侧留大片空白 */
  insetW = Math.max(px(74), Math.min(MAPW * fit * 0.24, px(124)));
  insetH = insetW * INH / INW;
  insetScale = insetW / INW;
  const igap = px(8);
  insetX = tx + MAPW * fit - insetW - igap;
  insetY = ty + MAPH * fit - insetH - igap;
  insetDotEls.forEach(c => c.setAttribute('r', 1.7 / insetScale));

  const clone = svg.cloneNode(true);
  const lbl = clone.querySelector('#labels'); if (lbl) lbl.remove();   /* 去掉行政区名 */
  const mk = clone.querySelector('#marks'); if (mk) mk.remove();

  /* 裁掉四周空白：导出区域 = 地图与南海小图的外接框 + 边距 */
  const mx = 12;
  const cx0 = Math.min(tx, insetX) - mx;
  const cy0 = ty - mx;
  const cx1 = Math.max(tx + MAPW * fit, insetX + insetW) + mx;
  const cy1 = Math.max(ty + MAPH * fit, insetY + insetH) + mx;
  const CW = cx1 - cx0, CH = (cy1 - cy0) + SHARE_STRIP;

  clone.querySelector('#gMain').setAttribute('transform',
    `translate(${tx - cx0},${ty - cy0}) scale(${s})`);
  const ig = clone.querySelector('#insetScaled');
  ig.setAttribute('transform', `translate(${insetX - cx0},${insetY - cy0}) scale(${insetScale})`);
  const ibg = clone.querySelector('#insetBg');
  ibg.setAttribute('x', insetX - cx0); ibg.setAttribute('y', insetY - cy0);
  const cap = clone.querySelector('#insetCap');
  cap.setAttribute('x', insetX - cx0 + insetW / 2);
  cap.setAttribute('y', insetY - cy0 + insetH - px(4));
  const bgEl = clone.querySelector('#bg');
  bgEl.setAttribute('width', CW); bgEl.setAttribute('height', CH);
  /* 背景底图跟着一起导出：沿用屏幕上的铺法，整体平移到裁切后的原点 */
  const bgWrap = clone.querySelector('#bgWrap');
  if (bgWrap) bgWrap.setAttribute('transform', `translate(${-cx0},${-cy0})`);

  clone.appendChild(el('rect', {
    x: 0, y: CH - SHARE_STRIP, width: CW, height: SHARE_STRIP,
    fill: '#FFFFFF', 'fill-opacity': 0.97
  }));
  clone.appendChild(el('rect', {
    x: 0, y: CH - SHARE_STRIP, width: CW, height: 1, fill: '#141414', 'fill-opacity': 0.13
  }));

  /* 还原视角 */
  zoom = old.zoom; tx = old.tx; ty = old.ty; fit = old.fit; extraBottom = old.extra;
  applyTransform();

  clone.setAttribute('width', Math.round(CW * SHARE_SCALE));
  clone.setAttribute('height', Math.round(CH * SHARE_SCALE));
  clone.setAttribute('viewBox', `0 0 ${CW} ${CH}`);
  const xml = new XMLSerializer().serializeToString(clone);

  const cv = document.createElement('canvas');
  cv.width = Math.round(CW * SHARE_SCALE);
  cv.height = Math.round(CH * SHARE_SCALE);
  const ctx = cv.getContext('2d');
  const img = new Image();
  return new Promise(resolve => {
    const paint = () => {
      /* 兜底色用当前背景图的边缘色，SVG 万一渲染失败也不会露出粉色 */
      ctx.fillStyle = document.getElementById('bg').getAttribute('fill') || '#EFB5B4';
      ctx.fillRect(0, 0, cv.width, cv.height);
      if (img.width) ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const fam = '"PingFang SC","Microsoft YaHei",sans-serif';
      let fs = 11 * SHARE_SCALE;
      ctx.font = fs + 'px ' + fam;
      ctx.fillStyle = '#6B4A4A';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const avail = cv.width - 16 * SHARE_SCALE;
      const tw = ctx.measureText(DISCLAIMER).width;
      if (tw > avail) {
        fs = fs * avail / tw;
        ctx.font = fs + 'px ' + fam;
      }
      ctx.fillText(DISCLAIMER, cv.width / 2, cv.height - SHARE_STRIP * SHARE_SCALE / 2);
      resolve(cv);
    };
    img.onload = paint;
    img.onerror = paint;                    /* 万一渲染失败也至少给张底色图 */
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  });
}

async function openShare() {
  const cv = await buildShareCanvas();
  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    document.getElementById('shareImg').src = url;
    const dl = document.getElementById('btnDownload');
    dl.href = url;
    document.getElementById('shareTip').textContent =
      `已去掉行政区名、保留行政区划界线 · ${cv.width}×${cv.height}`;
    document.getElementById('shareMask').classList.add('show');
  }, 'image/png');
}

document.getElementById('btnIn').onclick  = () => zoomAround(W/2, H/2, 1.45);

function doSearch() {
  const s = document.getElementById('searchInput').value.trim();
  if (!s) return;
  const hit = UNITS.findIndex(u => u.name.includes(s) || u.short.includes(s) ||
                                   (u.prov !== u.name && u.prov.includes(s)));
  if (hit < 0) { toast(`没有找到「${s}」`); return; }
  document.getElementById('searchMask').classList.remove('show');
  focusUnit(hit); showDetail(hit);
}
document.getElementById('btnSearchGo').onclick = doSearch;

  document.getElementById('searchMask').classList.remove('show');

};

  if (!f) return;

  rd.readAsDataURL(f);
  e.target.value = '';
};

/* ---------- 成就系统：34 省级行政区 × 5 级到达 ---------- */
/* 5 级 = 居住(0) / 过夜游(1) / 一日游(2) / 停留(3) / 经过(4)；上级兼容下级（累计计数） */
let provGroups = null;
function buildProvGroups() {
  if (provGroups) return provGroups;
  const map = new Map();
  UNITS.forEach((u, i) => {
    const key = u.code.slice(0, 2);
    if (!map.has(key)) map.set(key, { name: u.prov, key, ids: [] });
    map.get(key).ids.push(i);
  });
  provGroups = [...map.values()].sort((a, b) => a.key.localeCompare(b.key));
  return provGroups;
}
/* 该省在等级 k（0..4）上的累计达成数 = states[i] <= k 的个数（上级兼容下级） */
function levelCount(ids, k) {
  let c = 0;
  for (const i of ids) if (states[i] <= k) c++;
  return c;
}
function renderAchievements() {
  const groups = buildProvGroups();
  const list = document.getElementById('achList');
  list.innerHTML = '';
  let achieved = 0, totalVisited = 0;
  const frag = document.createDocumentFragment();
  for (const g of groups) {
    const n = g.ids.length;
    const vis = levelCount(g.ids, 4);
    if (vis > 0) achieved++;
    totalVisited += vis;

    const box = document.createElement('div');
    box.className = 'prov';
    const head = document.createElement('div');
    head.className = 'provHead';
    const caret = document.createElement('span');
    caret.className = 'caret'; caret.textContent = '▸';
    const name = document.createElement('span');
    name.className = 'provName'; name.textContent = g.name;
    const stat = document.createElement('span');
    stat.className = 'provStat';
    stat.textContent = vis > 0 ? ('已点亮 ' + vis + '/' + n) : '未点亮';
    head.appendChild(caret); head.appendChild(name); head.appendChild(stat);

    const levels = document.createElement('div');
    levels.className = 'provLevels';
    for (let k = 0; k < 5; k++) {
      const x = levelCount(g.ids, k);
      const row = document.createElement('div');
      row.className = 'lvl';
      const dot = document.createElement('span');
      dot.className = 'dot'; dot.style.background = COLORS[k];
      const nm = document.createElement('span');
      nm.className = 'lvlName'; nm.textContent = NAMES[k];
      const cnt = document.createElement('span');
      cnt.className = 'lvlCount'; cnt.textContent = '(' + x + '/' + n + ')';
      row.appendChild(dot); row.appendChild(nm); row.appendChild(cnt);
      levels.appendChild(row);
    }
    box.appendChild(head); box.appendChild(levels);
    head.addEventListener('click', () => {
      const open = box.classList.toggle('open');
      caret.textContent = open ? '▾' : '▸';
    });
    frag.appendChild(box);
  }
  list.appendChild(frag);
  document.getElementById('achSummary').textContent =
    '已达 ' + achieved + ' / 34 省 · 共点亮 ' + totalVisited + ' 个地级行政区';
  document.getElementById('btnAchExpand').textContent = '全部展开';
}
function setAchAll(open) {
  const list = document.getElementById('achList');
  list.querySelectorAll('.prov').forEach(b => {
    b.classList.toggle('open', open);
    b.querySelector('.caret').textContent = open ? '▾' : '▸';
  });
  document.getElementById('btnAchExpand').textContent = open ? '全部收起' : '全部展开';
}
function toggleAchAll() {
  const boxes = document.getElementById('achList').querySelectorAll('.prov');
  const allOpen = boxes.length > 0 && [...boxes].every(b => b.classList.contains('open'));
  setAchAll(!allOpen);
}
function openAchievements() {
  renderAchievements();
  document.getElementById('achMask').classList.add('show');
}

/* ---------- JSON 导出 / 导入（跨端迁移 + GitHub Pages 备份） ---------- */
function exportData() {
  const obj = { app: 'travel-map', schema: 1, exportedAt: new Date().toISOString(), states: {} };
  for (let i = 0; i < N; i++) if (states[i] !== UNVISITED) obj.states[UNITS[i].code] = states[i];
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '旅游地图-数据备份.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出数据 JSON');
}
function importData(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      const src = obj && obj.states ? obj.states : obj;
      const idx = {}; UNITS.forEach((u, i) => idx[u.code] = i);
      let applied = 0;
      for (const code in src) {
        const i = idx[code]; if (i === undefined) continue;
        const v = parseInt(src[code], 10); if (v >= 0 && v <= 5) { states[i] = v; applied++; }
      }
      for (let i = 0; i < N; i++) paint(i);
      persist(); refreshStats(); closeDetail();
      toast('已导入 ' + applied + ' 条记录');
    } catch (e) { toast('导入失败：不是有效的 JSON 文件'); }
  };
  rd.onerror = () => toast('读取文件失败');
  rd.readAsText(file);
}

/* 成就 / 数据按钮 */
document.getElementById('btnAch').onclick = openAchievements;
document.getElementById('btnAchClose').onclick = () =>
  document.getElementById('achMask').classList.remove('show');
document.getElementById('btnAchExpand').onclick = toggleAchAll;
document.getElementById('btnData').onclick = () =>
  document.getElementById('dataMask').classList.add('show');
document.getElementById('btnDataClose').onclick = () =>
  document.getElementById('dataMask').classList.remove('show');
document.getElementById('btnExport').onclick = exportData;
document.getElementById('btnImport').onclick = () => document.getElementById('dataFile').click();
document.getElementById('dataFile').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importData(f);
  e.target.value = '';
};

  if (e.key !== 'Escape') return;

  closeDetail();
});
